<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Darmwetter">
<meta name="theme-color" id="theme-color" content="#E8F3F2">
<link rel="apple-touch-icon" href="icon.png">
<title>Darmwetter</title>
<style>
  /* Tagdesign */
  :root {
    --bg: #E8F3F2;
    --ink: #1F4A4F;
    --ink-soft: #2F6A70;
    --primary: #2F5D62;
    --primary-dark: #1F4A4F;
    --on-primary: #FFFFFF;
    --card: #FFFFFF;
    --card-press: #F2F8F7;
    --line: #C9DEDC;
    --sel-bg: #DDEEEC;
    --sel-line: #2F5D62;
    --logo-line: #1F4A4F;
    --ok: #1B6E3A;
    --warn: #8A5A00;
    --err: #B3261E;
    color-scheme: light;
  }
  /* Nachtdesign (19:00 bis 7:00 Uhr) */
  :root.night {
    --bg: #0E1E2E;
    --ink: #DCE8EE;
    --ink-soft: #93AEBD;
    --primary: #2E6577;
    --primary-dark: #245262;
    --on-primary: #F2F8FA;
    --card: #17293B;
    --card-press: #1D3247;
    --line: #26405A;
    --sel-bg: #1F4258;
    --sel-line: #6FB3C8;
    --logo-line: #93AEBD;
    --ok: #7BD3A0;
    --warn: #E8C27A;
    --err: #F2A099;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  #app { max-width: 480px; margin: 0 auto; padding: 16px 0 32px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* Start */
  .home { text-align: center; padding-top: 6vh; }
  .home .logo svg { width: 190px; height: auto; }
  .home h1 { font-size: 38px; margin: 8px 0 4px; letter-spacing: -0.5px; }
  .home .sub { margin: 0 0 36px; color: var(--ink-soft); font-size: 17px; }
  .primary {
    display: block; width: 100%;
    padding: 22px 16px;
    font-size: 21px; font-weight: 650;
    color: var(--on-primary); background: var(--primary);
    border: 0; border-radius: 18px;
  }
  .primary:active { background: var(--primary-dark); }
  .primary:disabled { opacity: 0.45; }
  .meta { margin: 18px 0 0; font-size: 15px; color: var(--ink-soft); min-height: 20px; }
  .meta.warn { color: var(--warn); }
  .link {
    background: none; border: 0; padding: 12px;
    color: var(--ink-soft); font-size: 15px; text-decoration: underline;
  }

  /* Fragen */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
  .back { background: none; border: 0; padding: 10px 8px 10px 0; font-size: 17px; color: var(--ink-soft); }
  .count { font-size: 15px; color: var(--ink-soft); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 20px; }
  .bar div { height: 100%; background: var(--sel-line); border-radius: 3px; transition: width .2s; }
  h2 { font-size: 26px; margin: 0 0 8px; line-height: 1.2; }
  .qhint { margin: 0 0 16px; font-size: 15px; color: var(--ink-soft); min-height: 4px; }
  .grid { display: grid; gap: 10px; }
  .cols-1 { grid-template-columns: 1fr; }
  .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .opt {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    min-height: 72px; padding: 12px 10px;
    background: var(--card); border: 2px solid var(--line); border-radius: 16px;
    text-align: center;
  }
  .opt:active { background: var(--card-press); }
  .opt.sel { border-color: var(--sel-line); background: var(--sel-bg); }
  .opt .txt { display: flex; flex-direction: column; gap: 2px; }
  .opt .l { font-size: 18px; font-weight: 600; line-height: 1.2; }
  .opt .d { font-size: 13px; color: var(--ink-soft); }
  .cols-1 .opt { flex-direction: row; justify-content: flex-start; gap: 14px; min-height: 76px; padding: 8px 14px; text-align: left; }
  .cols-3 .opt { padding: 12px 4px; }
  .cols-3 .opt .l { font-size: 16px; }
  .opt.multi { padding-left: 28px; padding-right: 28px; }
  .multi .check { top: 6px; right: 6px; width: 20px; height: 20px; font-size: 12px; line-height: 16px; }
  .pic svg { width: 104px; height: 60px; display: block; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(127,127,127,.35); flex: none; }
  .check {
    position: absolute; top: 8px; right: 10px;
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--line); font-size: 14px; line-height: 18px; text-align: center; color: transparent;
  }
  .opt.sel .check { background: var(--sel-line); border-color: var(--sel-line); color: var(--bg); }
  .next { margin-top: 20px; }

  /* Übersicht */
  .when { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 12px 0 16px; }
  .when label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-soft); }
  input {
    font: inherit; font-size: 17px; color: var(--ink);
    padding: 12px; min-height: 48px;
    background: var(--card); border: 2px solid var(--line); border-radius: 12px; width: 100%;
  }
  .list { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 20px; border: 2px solid var(--line); }
  .row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    width: 100%; padding: 13px 16px; min-height: 48px;
    background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left;
  }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--ink-soft); font-size: 15px; white-space: nowrap; }
  .row .v { font-weight: 600; font-size: 15px; text-align: right; display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .row .v.missing { color: var(--err); }
  .row .swatch { width: 18px; height: 18px; }
  .hint { font-size: 14px; color: var(--ink-soft); margin: -8px 0 16px; }

  /* Fertig */
  .done { text-align: center; padding-top: 14vh; }
  .done .icon { font-size: 64px; line-height: 1; margin-bottom: 12px; }
  .done h2 { margin-bottom: 10px; }
  .done p { color: var(--ink-soft); margin: 0 0 32px; font-size: 17px; }
  .done.ok h2, .done.ok .icon { color: var(--ok); }
  .done.warn h2 { color: var(--warn); }

  /* Einstellungen */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; font-size: 15px; color: var(--ink-soft); }
  .msg { min-height: 22px; margin: 12px 0; font-size: 15px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ------------------------------------------------------------------
// Tag- und Nachtdesign: von 19:00 bis 7:00 Uhr dunkel
// ------------------------------------------------------------------
const NIGHT_FROM = 19;
const NIGHT_UNTIL = 7;
function applyTheme() {
  const h = new Date().getHours();
  const night = h >= NIGHT_FROM || h < NIGHT_UNTIL;
  document.documentElement.classList.toggle('night', night);
  document.getElementById('theme-color').setAttribute('content', night ? '#0E1E2E' : '#E8F3F2');
}
applyTheme();
setInterval(applyTheme, 60000);

// ------------------------------------------------------------------
// Bilder für die Bristol-Typen
// ------------------------------------------------------------------
const BR = '#8B5E3C', BR_LIGHT = '#A9743F', BR_DARK = '#4A2E1C';

function eye(cx, cy, r, mood) {
  if (mood === 'happy') {
    return `<path d="M${cx - r} ${cy + r * 0.3} Q${cx} ${cy - r} ${cx + r} ${cy + r * 0.3}" fill="none" stroke="${BR_DARK}" stroke-width="2.6" stroke-linecap="round"/>`;
  }
  const py = mood === 'strain' ? cy - r * 0.35 : cy + r * 0.2;
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${BR_DARK}" stroke-width="1.6"/>`
        + `<circle cx="${cx}" cy="${py}" r="${r * 0.48}" fill="${BR_DARK}"/>`;
  if (mood === 'tired') {
    s += `<path d="M${cx - r - 0.8} ${cy} A${r + 0.8} ${r + 0.8} 0 0 1 ${cx + r + 0.8} ${cy} Z" fill="${BR}" stroke="${BR_DARK}" stroke-width="1.6"/>`;
  }
  return s;
}
function eyes(x1, x2, y, r, mood) { return eye(x1, y, r, mood) + eye(x2, y, r, mood); }
function blobs(circles, fill) {
  const out = circles.map(c => `<circle cx="${c[0]}" cy="${c[1]}" r="${c[2] + 2}"/>`).join('');
  const inn = circles.map(c => `<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}"/>`).join('');
  return `<g fill="${BR_DARK}">${out}</g><g fill="${fill}">${inn}</g>`;
}
function svg(body) {
  return `<svg viewBox="0 0 120 70" aria-hidden="true">${body}</svg>`;
}

    `<g fill="${BR}" stroke="${BR_DARK}" stroke-width="2">`

    + `<ellipse cx="54" cy="28" rx="15" ry="11" transform="rotate(8 54 28)"/>`
    + `<ellipse cx="64" cy="54" rx="14" ry="9" transform="rotate(-6 64 54)"/>`
    + `<ellipse cx="94" cy="40" rx="15" ry="10" transform="rotate(14 94 40)"/></g>`
    + eyes(48, 60, 27, 4.5, 'normal')
  ),
  6: svg(
    blobs([[18, 40, 8], [27, 34, 9], [36, 44, 9], [44, 33, 10], [54, 42, 11], [64, 32, 10], [72, 44, 10],
           [82, 35, 9], [90, 44, 8], [99, 37, 8], [106, 44, 6], [30, 50, 6], [60, 52, 7], [86, 51, 6], [12, 46, 5]], BR)

  7: svg(
    `<path d="M10 44 C12 32 36 29 58 32 C80 29 108 33 108 45 C108 55 88 59 66 56 C44 61 12 59 10 44 Z" fill="${BR_LIGHT}" stroke="${BR_DARK}" stroke-width="2"/>`
    + `<ellipse cx="18" cy="62" rx="6" ry="3" fill="${BR_LIGHT}" stroke="${BR_DARK}" stroke-width="1.5"/>`
    + `<ellipse cx="104" cy="24" rx="4" ry="2.5" fill="${BR_LIGHT}" stroke="${BR_DARK}" stroke-width="1.5"/>`
    + eye(52, 42, 5, 'tired').replace(new RegExp(BR, 'g'), BR_LIGHT)
    + eye(66, 42, 5, 'tired').replace(new RegExp(BR, 'g'), BR_LIGHT)
    + `<path d="M54 52 Q59 48 64 52" fill="none" stroke="${BR_DARK}" stroke-width="2" stroke-linecap="round"/>`
  )
};

// ------------------------------------------------------------------
// Fragen. In der App steht nur Text, ins Sheet geht der Wert "v".
// Die Spaltenreihenfolge im Sheet steht weiter unten in buildRow().
// ------------------------------------------------------------------
function scale(from, labels) {
  return labels.map((l, i) => ({ v: from + i, l: l }));
}
const YES_NO = [{ v: 0, l: 'Nein' }, { v: 1, l: 'Ja' }];
const COLORS = [
  ['Dunkelbraun', '#5A3418'],
  ['Braun', '#7B4A26'],
  ['Hellbraun', '#A8743F'],
  ['Ocker', '#C8912E'],
  ['Gelb', '#DDB93C'],
  ['Grün', '#6E8B3D'],
  ['Schwarz', '#2B2420'],
  ['Rötlich', '#B5523F'],
  ['Dunkelrot', '#7A1F1F']
];

const QUESTIONS = [
  { key: 'menge', short: 'Menge', title: 'Wie viel war es?', cols: 2,
    options: scale(0, ['nichts', 'sehr wenig', 'wenig', 'normal', 'viel', 'sehr viel']) },
  { key: 'flatulenz', short: 'Flatulenz', title: 'Wie viel Luft war dabei?', cols: 2,
    options: scale(0, ['keine', 'sehr wenig', 'wenig', 'mittel', 'viel', 'sehr viel']) },
  { key: 'farbe', short: 'Farbe', title: 'Welche Farbe?', cols: 3,
    options: COLORS.map(c => ({ v: c[1], l: c[0], swatch: c[1] })) },
  { key: 'bristol', short: 'Bristol-Typ', title: 'Wie sah es aus?', cols: 1,
    options: [
      'harte Kügelchen',
      'klumpige Wurst',
      'rissige Wurst',
      'glatte, weiche Wurst',
      'weiche Klümpchen',
      'breiig, ausgefranst',
      'flüssig'
    ].map((l, i) => ({ v: i + 1, l: l, d: 'Typ ' + (i + 1), img: BRISTOL_PICS[i + 1] })) },
  { key: 'blut', short: 'Blut', title: 'War Blut dabei?', cols: 2,
    options: scale(0, ['kein Blut', 'Spuren, Schlieren', 'deutlich sichtbar', 'überwiegend Blut']) },
  { key: 'schmerz', short: 'Schmerzen', title: 'Hattest du Schmerzen?', cols: 2,
    options: scale(0, ['keine', 'sehr leicht', 'leicht', 'mittel', 'stark', 'sehr stark']) },
  { key: 'lage', short: 'Schmerzlage', title: 'Wo tut es weh?', cols: 2, multi: true,
    skip: a => a.schmerz === 0,
    options: ['links unten', 'rechts unten', 'mitte unten', 'oben', 'diffus', 'Rektum/After'].map(x => ({ v: x, l: x.replace('/', '/<wbr>') })) },
  { key: 'zeitpunkt', short: 'Schmerzzeitpunkt', title: 'Wann tut es weh?', cols: 2, multi: true,
    skip: a => a.schmerz === 0,
    options: [
      { v: 'vor', l: 'vorher' },
      { v: 'während', l: 'währenddessen' },
      { v: 'nach', l: 'danach' },
      { v: 'unabhängig', l: 'unabhängig' }
    ] },
  { key: 'schleim', short: 'Schleim', title: 'War Schleim dabei?', cols: 3,
    options: scale(0, ['kein', 'etwas', 'viel']) },
  { key: 'dringlichkeit', short: 'Dringlichkeit', title: 'Wie dringend war es?', cols: 2,
    options: scale(0, ['kein Drang', 'konnte kurz warten', 'musste sofort', 'kaum zu halten']) },
  { key: 'inkontinenz', short: 'Inkontinenz', title: 'Ist etwas danebengegangen?', cols: 2,
    options: YES_NO },
  { key: 'tenesmus', short: 'Tenesmus', title: 'Gefühl, nicht fertig zu sein?', cols: 2,
    options: YES_NO }
];

// Spaltenreihenfolge wie im Google Sheet:
// Datum, Uhrzeit, Menge, Flatulenz, Farbe, Bristol-Typ, Blut,
// Schmerzintensität, Schmerzlage, Schmerzzeitpunkt, Schleim,
// Dringlichkeit, Inkontinenz, Tenesmus
function buildRow(a, datum, uhrzeit) {
  const keinSchmerz = a.schmerz === 0;
  return [
    datum, uhrzeit,
    a.menge, a.flatulenz, a.farbe, a.bristol, a.blut,
    a.schmerz,
    keinSchmerz ? '' : a.lage.join(', '),
    keinSchmerz ? '' : a.zeitpunkt.join(', '),
    a.schleim, a.dringlichkeit, a.inkontinenz, a.tenesmus
  ];
}

// ------------------------------------------------------------------
// Speicher auf dem Handy
// ------------------------------------------------------------------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function getQueue() {
  try { return JSON.parse(store.get('dw_queue') || '[]'); } catch (e) { return []; }
}
function setQueue(q) { store.set('dw_queue', JSON.stringify(q)); }
function hasCredentials() { return !!(store.get('dw_url') && store.get('dw_token')); }

// ------------------------------------------------------------------
// Senden ans Google Sheet (mit Warteschlange, falls offline)
// ------------------------------------------------------------------
async function sendRow(row) {
  const url = store.get('dw_url');
  const token = store.get('dw_token');
  if (!url || !token) throw new Error('nocreds');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch(url, {
      method: 'POST',
      body: JSON.stringify({ token: token, row: row }),
      signal: ctrl.signal
    });
    const text = (await res.text()).trim();
    if (text === 'forbidden') throw new Error('forbidden');
    if (text !== 'ok') throw new Error('Unerwartete Antwort: ' + text.slice(0, 80));
  } finally {
    clearTimeout(timer);
  }
}

let flushing = false;
async function flushQueue() {
  if (flushing) return { ok: false, error: 'busy' };
  flushing = true;
  try {
    let q = getQueue();
    while (q.length) {
      try {
        await sendRow(q[0]);
      } catch (e) {
        return { ok: false, error: e.message };
      }
      q.shift();
      setQueue(q);
    }
    return { ok: true };
  } finally {
    flushing = false;
  }
}

// ------------------------------------------------------------------
// Zustand und Bildschirme
// ------------------------------------------------------------------
let state = { screen: 'home', answers: {}, step: 0, editing: false, when: null, result: null };

function pad(n) { return String(n).padStart(2, '0'); }
function nowParts() {
  const d = new Date();
  return {
    date: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
    time: pad(d.getHours()) + ':' + pad(d.getMinutes())
  };
}
function isSkipped(i) {
  const q = QUESTIONS[i];
  return !!(q.skip && q.skip(state.answers));
}
function activeIndices() {
  return QUESTIONS.map((_, i) => i).filter(i => !isSkipped(i));
}
function isAnswered(q) {
  const v = state.answers[q.key];
  if (q.multi) return Array.isArray(v) && v.length > 0;
  return v !== undefined;
}
function answerLabel(q, value) {
  if (q.multi) {
    if (!Array.isArray(value) || !value.length) return null;
    return q.options.filter(o => value.includes(o.v)).map(o => o.l).join(', ');
  }
  const o = q.options.find(o => o.v === value);
  if (!o) return null;
  return o.d ? o.l + ' · ' + o.d : o.l;
}

const LOGO = `
<svg viewBox="0 0 220 190" role="img" aria-label="Darmwetter-Logo: lächelnde Wolke mit Sonne">

<circle cx="100" cy="92" r="36"/><circle cx="138" cy="110" r="28"/>

function viewHome() {
  const q = getQueue().length;
  const last = store.get('dw_last');
  let meta = '';
  let cls = 'meta';
  if (!hasCredentials()) {
    meta = 'Noch keine Verbindung zum Google Sheet. Bitte unter Einstellungen eintragen.';
    cls += ' warn';
  } else if (q > 0) {
    meta = q === 1 ? '1 Eintrag wartet auf Versand.' : q + ' Einträge warten auf Versand.';
    cls += ' warn';
  } else if (last) {
    meta = 'Letzter Eintrag: ' + last;
  }
  return `
  <div class="home">
    <div class="logo">${LOGO}</div>
    <h1>Darmwetter</h1>
    <p class="sub">Wie ist das Wetter im Bauch?</p>
    <button class="primary" data-act="start">Ich war grad</button>
    <p class="${cls}">${meta}</p>
    <button class="link" data-act="settings">Einstellungen</button>
  </div>`;
}

function viewQuestion() {
  const i = state.step;
  const q = QUESTIONS[i];
  const active = activeIndices();
  const pos = active.indexOf(i) + 1;
  const pct = Math.round((pos - 1) / active.length * 100);
  const current = state.answers[q.key];
  const opts = q.options.map((o, idx) => {
    const selected = q.multi ? (Array.isArray(current) && current.includes(o.v)) : o.v === current;
    const sw = o.swatch ? `<span class="swatch" style="background:${o.swatch}"></span>` : '';
    const pic = o.img ? `<span class="pic">${o.img}</span>` : '';
    const d = o.d ? `<span class="d">${o.d}</span>` : '';
    const check = q.multi ? '<span class="check">✓</span>' : '';
    return `<button class="opt${q.multi ? ' multi' : ''}${selected ? ' sel' : ''}" data-act="${q.multi ? 'toggle' : 'pick'}" data-i="${idx}" aria-pressed="${selected}">`
      + `${check}${sw}${pic}<span class="txt"><span class="l">${o.l}</span>${d}</span></button>`;
  }).join('');
  const hint = q.multi ? 'Mehrfachauswahl möglich' : '';
  const next = q.multi
    ? `<button class="primary next" data-act="next"${isAnswered(q) ? '' : ' disabled'}>Weiter</button>`
    : '';
  return `
  <div class="top">
    <button class="back" data-act="back">‹ Zurück</button>
    <span class="count">${pos} / ${active.length}</span>
  </div>
  <div class="bar"><div style="width:${pct}%"></div></div>
  <h2>${q.title}</h2>
  <p class="qhint">${hint}</p>
  <div class="grid cols-${q.cols}">${opts}</div>
  ${next}`;
}

function viewSummary() {
  const rows = QUESTIONS.map((q, i) => {
    if (isSkipped(i)) return '';
    const value = state.answers[q.key];
    const label = answerLabel(q, value);
    const sw = q.key === 'farbe' && label ? `<span class="swatch" style="background:${value}"></span>` : '';
    const v = label === null ? '<span class="v missing">fehlt</span>' : `<span class="v">${sw}${label}</span>`;
    return `<button class="row" data-act="edit" data-i="${i}"><span class="k">${q.short}</span>${v}</button>`;
  }).join('');
  return `
  <div class="top">
    <button class="back" data-act="back">‹ Zurück</button>
    <span class="count">Übersicht</span>
  </div>
  <div class="bar"><div style="width:100%"></div></div>
  <h2>Alles richtig?</h2>
  <div class="when">
    <label>Datum<input type="date" id="f-date" value="${state.when.date}"></label>
    <label>Uhrzeit<input type="time" id="f-time" value="${state.when.time}"></label>
  </div>
  <p class="hint">Tippe auf eine Zeile, um sie zu ändern.</p>
  <div class="list">${rows}</div>
  <button class="primary" data-act="save" id="save-btn">Speichern</button>
  <div style="text-align:center"><button class="link" data-act="cancel">Verwerfen</button></div>`;
}

function viewDone() {
  const r = state.result;
  let icon = '✓', title = 'Gespeichert', text = 'Der Eintrag ist im Google Sheet.', cls = 'ok';
  if (!r.ok) {
    cls = 'warn';
    icon = '⏳';
    title = 'Lokal gespeichert';
    if (r.error === 'nocreds') {
      text = 'Es ist noch keine Verbindung eingerichtet. Trag sie unter Einstellungen ein, dann wird der Eintrag nachgesendet.';
    } else if (r.error === 'forbidden') {
      text = 'Das Google Sheet hat das Passwort abgelehnt. Prüfe es unter Einstellungen. Der Eintrag wird nachgesendet.';
    } else {
      text = 'Gerade keine Verbindung. Der Eintrag wird automatisch gesendet, sobald du wieder online bist.';
    }
  }
  return `
  <div class="done ${cls}">
    <div class="icon">${icon}</div>
    <h2>${title}</h2>
    <p>${text}</p>
    <button class="primary" data-act="home">Fertig</button>
  </div>`;
}

function viewSettings() {
  const q = getQueue().length;
  const url = (store.get('dw_url') || '').replace(/"/g, '&quot;');
  const token = (store.get('dw_token') || '').replace(/"/g, '&quot;');
  return `
  <div class="top">
    <button class="back" data-act="home">‹ Zurück</button>
    <span class="count">Einstellungen</span>
  </div>
  <h2>Verbindung zum Google Sheet</h2>
  <p class="qhint"></p>
  <label class="field">Web-App-URL (endet auf /exec)
    <input type="url" id="s-url" value="${url}" autocapitalize="off" autocorrect="off" spellcheck="false">
  </label>
  <label class="field">Geheimer Schlüssel
    <input type="password" id="s-token" value="${token}" autocapitalize="off" autocorrect="off" spellcheck="false">
  </label>
  <button class="primary" data-act="savesettings">Speichern</button>
  <div class="msg" id="s-msg"></div>
  <p class="meta">${q === 0 ? 'Keine Einträge in der Warteschlange.' : (q === 1 ? '1 Eintrag wartet auf Versand.' : q + ' Einträge warten auf Versand.')}</p>
  ${q > 0 ? '<div style="text-align:center"><button class="link" data-act="flush">Jetzt senden</button></div>' : ''}`;
}

function render(keepScroll) {
  const y = window.scrollY;
  const app = document.getElementById('app');
  const views = { home: viewHome, question: viewQuestion, summary: viewSummary, done: viewDone, settings: viewSettings };
  app.innerHTML = views[state.screen]();
  window.scrollTo(0, keepScroll ? y : 0);
}

// ------------------------------------------------------------------
// Navigation
// ------------------------------------------------------------------
function goNext() {
  for (let i = state.step + 1; i < QUESTIONS.length; i++) {
    if (isSkipped(i)) continue;
    if (state.editing && isAnswered(QUESTIONS[i])) continue;
    state.step = i;
    state.screen = 'question';
    return render();
  }
  state.editing = false;
  state.screen = 'summary';
  render();
}

function goBack() {
  if (state.screen === 'summary') {
    const active = activeIndices();
    state.step = active[active.length - 1];
    state.screen = 'question';
    return render();
  }
  for (let i = state.step - 1; i >= 0; i--) {
    if (isSkipped(i)) continue;
    state.step = i;
    return render();
  }
  if (Object.keys(state.answers).length === 0 || confirm('Eintrag verwerfen?')) {
    state.screen = 'home';
    render();
  }
}

function readWhen() {
  const d = document.getElementById('f-date');
  const t = document.getElementById('f-time');
  if (d && d.value) state.when.date = d.value;
  if (t && t.value) state.when.time = t.value;
}

async function save(btn) {
  readWhen();
  const missing = activeIndices().filter(i => !isAnswered(QUESTIONS[i]));
  if (missing.length) {
    state.step = missing[0];
    state.editing = true;
    state.screen = 'question';
    return render();
  }
  btn.disabled = true;
  btn.textContent = 'Sende …';
  const row = buildRow(state.answers, state.when.date, state.when.time);
  const q = getQueue();
  q.push(row);
  setQueue(q);
  const [y, m, d] = state.when.date.split('-');
  store.set('dw_last', d + '.' + m + '.' + y + ', ' + state.when.time + ' Uhr');
  state.result = await flushQueue();
  state.answers = {};
  state.screen = 'done';
  render();
}

document.getElementById('app').addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'start') {
    applyTheme();
    state = { screen: 'question', answers: {}, step: 0, editing: false, when: nowParts(), result: null };
    render();
  } else if (act === 'pick') {
    const q = QUESTIONS[state.step];
    state.answers[q.key] = q.options[Number(el.dataset.i)].v;
    el.classList.add('sel');
    setTimeout(goNext, 120);
  } else if (act === 'toggle') {
    const q = QUESTIONS[state.step];
    const v = q.options[Number(el.dataset.i)].v;
    const list = Array.isArray(state.answers[q.key]) ? state.answers[q.key].slice() : [];
    const at = list.indexOf(v);
    if (at >= 0) list.splice(at, 1); else list.push(v);
    // Reihenfolge wie in der Liste, nicht wie angeklickt
    state.answers[q.key] = q.options.map(o => o.v).filter(x => list.includes(x));
    render(true);
  } else if (act === 'next') {
    goNext();
  } else if (act === 'back') {
    if (state.screen === 'summary') readWhen();
    goBack();
  } else if (act === 'edit') {
    readWhen();
    state.step = Number(el.dataset.i);
    state.editing = true;
    state.screen = 'question';
    render();
  } else if (act === 'save') {
    save(el);
  } else if (act === 'cancel') {
    if (confirm('Eintrag verwerfen?')) { state.answers = {}; state.screen = 'home'; render(); }
  } else if (act === 'home') {
    state.screen = 'home';
    render();
  } else if (act === 'settings') {
    state.screen = 'settings';
    render();
  } else if (act === 'savesettings') {
    const url = document.getElementById('s-url').value.trim();
    const token = document.getElementById('s-token').value.trim();
    const msg = document.getElementById('s-msg');
    if (!url || !token) {
      msg.className = 'msg err';
      msg.textContent = 'Bitte beide Felder ausfüllen.';
      return;
    }
    store.set('dw_url', url);
    store.set('dw_token', token);
    msg.className = 'msg ok';
    msg.textContent = 'Gespeichert.';
    if (getQueue().length) {
      const r = await flushQueue();
      if (r.ok) {
        render();
        const m = document.getElementById('s-msg');
        m.className = 'msg ok';
        m.textContent = 'Gespeichert, Warteschlange gesendet.';
      }
    }
  } else if (act === 'flush') {
    el.disabled = true;
    el.textContent = 'Sende …';
    const r = await flushQueue();
    render();
    const msg = document.getElementById('s-msg');
    msg.className = r.ok ? 'msg ok' : 'msg err';
    msg.textContent = r.ok ? 'Alles gesendet.' : (r.error === 'forbidden' ? 'Schlüssel wurde abgelehnt.' : 'Senden fehlgeschlagen. Später nochmal versuchen.');
  }
});

// Wartende Einträge nachsenden: beim Start, wenn das Netz zurückkommt
// und wenn die App wieder in den Vordergrund kommt.
async function backgroundFlush() {
  if (!getQueue().length || !hasCredentials()) return;
  await flushQueue();
  if (state.screen === 'home') render();
}
window.addEventListener('online', backgroundFlush);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    applyTheme();
    backgroundFlush();
  }
});

render();
backgroundFlush();
</script>
